name: Foundation checks
on:
  push:
    branches: [main, feature/foundation]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: hubops-foundation-build
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-lockfile
          path: package-lock.json
